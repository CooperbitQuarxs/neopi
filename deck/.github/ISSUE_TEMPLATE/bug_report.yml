name: Bug Report
description: Report a bug or crash
labels: ["needs-triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the issue
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: error-output
    attributes:
      label: Error Output
      description: Paste any error messages or stack traces
      render: shell

  - type: dropdown
    id: environment
    attributes:
      label: Platform
      options:
        - macOS
        - Linux
        - Windows (native)
        - Windows (WSL)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: NPI deck version / commit
      description: Version in package.json or the checkout commit (`git rev-parse HEAD`)
      placeholder: "e.g. 0.7.0-dev or commit SHA"
    validations:
      required: true

  - type: input
    id: bun-version
    attributes:
      label: Bun version
      description: Output of `bun --version`
      placeholder: "e.g. 1.3.8"
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Provider
      description: Which provider were you using? Leave blank if not provider-specific.
      options:
        - Anthropic (Claude Pro/Max)
        - ChatGPT Plus/Pro (Codex)
        - GitHub Copilot
        - Google Cloud Code Assist (Gemini CLI)
        - Antigravity (Gemini 3, Claude, GPT-OSS)
        - Cursor
        - OpenCode Zen
        - Kimi Code
        - Z.AI (GLM)
        - MiniMax Coding Plan
        - Perplexity
        - Amazon Bedrock
        - OpenRouter
        - Ollama / Local
        - Custom NeoPi provider
        - Other

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of NPI deck is affected?
      options:
        - Web UI / Display
        - Authentication / Login
        - Chat / Model selection
        - Tool execution
        - MCP servers
        - Messaging bridges
        - Launcher / Service
        - Setup / Installation
        - Sessions / Worktrees
        - Other

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Screenshots, config snippets, or other relevant information
