name: Question
description: Ask about usage or configuration
labels: ["needs-triage"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: What are you trying to do?

  - type: dropdown
    id: area
    attributes:
      label: Topic
      options:
        - Provider setup / Login
        - NeoPi configuration
        - Canvas / Cards
        - Messaging bridges
        - MCP servers
        - Skills / Commands
        - Configuration / Launcher / Service
        - Other

  - type: dropdown
    id: environment
    attributes:
      label: Platform
      options:
        - macOS
        - Linux
        - Windows
