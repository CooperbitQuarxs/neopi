name: CI

on:
  push:
    branches: [main, nightly]
  pull_request:
    branches: [main, nightly]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit to publish as a stable release"
        required: true
        default: main
        type: string

# Supersede stale PR heads, but keep every push proof on nightly/main.
# Unique non-PR groups also prevent replacement of older pending runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  release_metadata:
    name: Resolve source and release metadata
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.metadata.outputs.sha }}
      publish: ${{ steps.metadata.outputs.publish }}
      tag: ${{ steps.metadata.outputs.tag }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          persist-credentials: false

      - name: Resolve immutable source and unique release tag
        id: metadata
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const { execFileSync } = require('node:child_process');
            const sha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
            const { version } = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(version)) {
              throw new Error(`Invalid package version: ${version}`);
            }
            const nightly = context.eventName === 'push' && context.ref === 'refs/heads/nightly';
            const publish = context.eventName === 'workflow_dispatch' ||
              (context.eventName === 'push' &&
                context.ref === `refs/heads/${context.payload.repository.default_branch}`) || nightly;
            const build = `${context.runId}.${process.env.GITHUB_RUN_ATTEMPT}`;
            const tag = nightly
              ? `v${version.split('+')[0]}-nightly.${sha.slice(0, 12)}.${build}`
              : `v${version}${version.includes('+') ? '.' : '+'}build.${build}`;
            core.setOutput('sha', sha);
            core.setOutput('publish', String(publish));
            core.setOutput('tag', tag);
            core.setOutput('prerelease', String(nightly));

  # ─── Cross-platform matrix: typecheck + test + web build ──────────────────
  #
  # All three OSes run the same gates against the same Bun version. Anything
  # that diverges per-platform belongs in the source, not here — the matrix
  # exists to catch divergence early.
  matrix:
    name: ${{ matrix.os }} · bun ${{ matrix.bun }}
    needs: release_metadata
    # Only the Linux release steps use the write token. Checkout never stores
    # credentials, and builds/tests receive no token in their environment.
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        bun: ["1.3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_metadata.outputs.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}

      - name: install Linux read-only sandbox prerequisite
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          command -v bwrap
          bwrap --version

      - name: bun install (frozen)
        run: bun install --frozen-lockfile

      # The server's program includes NeoPi's sources (tsconfig.neopi.json), and its tests load a
      # real NeoPi backend. scripts/neopi-setup.ts prepares the tree pinned in neopi.pin: frozen
      # install, a native addon built from the tree's own sources and verified against the version
      # sentinel, backend registration in NPI_DECK_HOME, and tsconfig.neopi.json. The source clone
      # and NPI_DECK_HOME live under RUNNER_TEMP so `bun test` never discovers NeoPi's own tests.
      - name: fetch NeoPi at neopi.pin
        shell: bash
        run: |
          pin="$(tr -d '[:space:]' < neopi.pin)"
          src="$RUNNER_TEMP/neopi-source"
          git init -q "$src"
          git -C "$src" remote add origin https://github.com/PsychedelicShayna/neopi.git
          git -C "$src" fetch -q --depth 1 origin "$pin"
          git -C "$src" checkout -q --detach FETCH_HEAD
          echo "NPI_DECK_NEOPI_SOURCE=$src" >> "$GITHUB_ENV"
          echo "NPI_DECK_HOME=$RUNNER_TEMP/npi-deck-home" >> "$GITHUB_ENV"

      # NeoPi's Swift bridge can select the newer Command Line Tools SDK even
      # when Xcode is the default. Use that same toolchain for the native linker.
      - name: select matching macOS compiler and SDK
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export DEVELOPER_DIR=/Library/Developer/CommandLineTools
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          echo "SDKROOT=$sdk" >> "$GITHUB_ENV"
          xcrun clang --version
          xcrun ld -v
          xcrun swiftc --version
          echo "SDKROOT=$sdk"

      - name: prepare NeoPi backend (install, native addon, tsconfig)
        run: bun scripts/neopi-setup.ts --build-native

      - name: test CI reporting helpers
        run: bun test ./.github/scripts/check-reporting.test.ts

      - name: typecheck (all workspaces)
        id: typecheck
        # Telegram's program includes the pinned SDK. macOS Node defaults to
        # about 2 GiB, which is too small; workspace checks run serially.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: bun .github/scripts/typecheck.ts

      - name: test (all workspaces)
        id: tests
        # Keep independent test evidence even when the preceding gate failed.
        if: ${{ !cancelled() }}
        continue-on-error: ${{ github.event_name == 'push' && github.ref == 'refs/heads/nightly' }}
        shell: bash
        run: |
          set -euo pipefail
          bun test 2>&1 | tee "$RUNNER_TEMP/tests.log"

      - name: report test counts and failures
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        run: bun .github/scripts/test-summary.ts "${{ runner.temp }}/tests.log" "${{ steps.tests.outcome }}"

      - name: web build
        shell: bash
        run: |
          set -euo pipefail
          bun run --cwd apps/web build
          test -d apps/web/dist

      # Typecheck fails on deck-owned errors; pinned NeoPi diagnostics are reported.
      # Nightly tests remain informational, with counts/names in each job summary.
      # Stable releases require tests to pass as well as the production build.
      # macOS/Windows run independently; reuse the existing Ubuntu web build.
      - name: Package checkout sources and the existing web build
        if: runner.os == 'Linux' && needs.release_metadata.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/release-checkout"
          mkdir -p "$staging/neodeck" "$RUNNER_TEMP/release-assets"
          git archive HEAD | tar -x -C "$staging/neodeck"
          cp -a apps/web/dist "$staging/neodeck/apps/web/dist"
          tar -czf "$RUNNER_TEMP/release-assets/neodeck-checkout.tar.gz" -C "$staging" neodeck
          cd "$RUNNER_TEMP/release-assets"
          sha256sum neodeck-checkout.tar.gz > SHA256SUMS

      - name: Preserve packaged checkout as a workflow artifact
        if: runner.os == 'Linux' && needs.release_metadata.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: neodeck-checkout-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error

      - name: Refuse existing releases or tags
        if: runner.os == 'Linux' && needs.release_metadata.outputs.publish == 'true'
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ needs.release_metadata.outputs.tag }}
        with:
          script: |
            const checks = [
              () => github.rest.git.getRef({
                ...context.repo, ref: `tags/${process.env.RELEASE_TAG}`,
              }),
              () => github.rest.repos.getReleaseByTag({
                ...context.repo, tag: process.env.RELEASE_TAG,
              }),
            ];
            for (const check of checks) {
              try {
                await check();
              } catch (error) {
                if (error.status === 404) continue;
                throw error;
              }
              throw new Error(`Refusing to overwrite existing release/tag ${process.env.RELEASE_TAG}`);
            }

      - name: Publish a new GitHub release
        if: runner.os == 'Linux' && needs.release_metadata.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release_metadata.outputs.tag }}
          target_commitish: ${{ needs.release_metadata.outputs.sha }}
          name: NPI deck ${{ needs.release_metadata.outputs.tag }}
          prerelease: ${{ needs.release_metadata.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.release_metadata.outputs.prerelease == 'true' && 'false' || 'true' }}
          generate_release_notes: true
          body: |
            Source commit: `${{ needs.release_metadata.outputs.sha }}`.

            Ubuntu typecheck: **${{ steps.typecheck.outcome }}**.
            Ubuntu tests: **${{ steps.tests.outcome }}**.
            [CI run and platform results](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).
            Nightly prereleases require deck-owned typechecks and build/package
            success. Test failures remain informational and appear in job summaries;
            stable releases require the Ubuntu tests to pass.

            `neodeck-checkout.tar.gz` contains the tracked source tree and the web
            bundle from this run's Ubuntu CI build, not a standalone executable
            or installer. Bun, dependencies, and the pinned NeoPi backend/native
            addon are still required. Follow the checkout-based
            [installation instructions](https://github.com/${{ github.repository }}/blob/${{ needs.release_metadata.outputs.sha }}/docs/install.md)
            and [release archive instructions](https://github.com/${{ github.repository }}/blob/${{ needs.release_metadata.outputs.sha }}/README.md#releases).

            Every release and tag is retained; new nightlies never replace or
            delete earlier nightlies or stable releases.
          files: |
            ${{ runner.temp }}/release-assets/neodeck-checkout.tar.gz
            ${{ runner.temp }}/release-assets/SHA256SUMS
          fail_on_unmatched_files: true
          token: ${{ github.token }}
