name: macOS routine hook probe

on:
  workflow_dispatch:
  # Dispatch registration requires a default-branch copy. This narrow trigger
  # lets nightly diagnostics run without promoting application code to main.
  push:
    branches:
      - "ci/mac-hook-probe-run/**"

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install frozen dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Fetch pinned backend
        shell: bash
        run: |
          pin="$(tr -d '[:space:]' < neopi.pin)"
          src="$RUNNER_TEMP/neopi-source"
          git init -q "$src"
          git -C "$src" remote add origin https://github.com/PsychedelicShayna/neopi.git
          git -C "$src" fetch -q --depth 1 origin "$pin"
          git -C "$src" checkout -q --detach FETCH_HEAD
          echo "NPI_DECK_NEOPI_SOURCE=$src" >> "$GITHUB_ENV"
          echo "NPI_DECK_HOME=$RUNNER_TEMP/npi-deck-home" >> "$GITHUB_ENV"
      - name: Select matching macOS compiler and SDK
        shell: bash
        run: |
          export DEVELOPER_DIR=/Library/Developer/CommandLineTools
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
      - name: Prepare pinned backend
        run: bun scripts/neopi-setup.ts --build-native
      - name: Record host and unchanged application sources
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/mac-hook-receipts"
          {
            git rev-parse HEAD
            sw_vers
            uname -a
            bun --version
            git diff --exit-code HEAD -- apps packages scripts
            shasum apps/server/src/owned-process.ts apps/server/src/routines/steps/run.ts apps/server/src/routines/v1-runner.ts apps/server/src/routines/foundations.test.ts apps/server/src/routines/test-fixture.ts
          } | tee "$RUNNER_TEMP/mac-hook-receipts/source-and-host.txt"
      - name: Execute original deadline and duration-budget cases with native observers
        run: bun .github/scripts/mac-hook-probe.cjs "$RUNNER_TEMP/mac-hook-receipts"
      - name: Print correlated receipts
        if: always()
        shell: bash
        run: |
          for file in "$RUNNER_TEMP/mac-hook-receipts/"*; do
            test -f "$file" || continue
            echo "===== $file ====="
            cat "$file"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-hook-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/mac-hook-receipts
          if-no-files-found: error
          retention-days: 30
